<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Django Fullstack Starter{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
  </head>
  <body class="flex flex-col min-h-screen antialiased text-gray-900 bg-white">
    <main class="flex-1">
      {% if messages %}
        <div class="max-w-5xl px-6 pt-4 mx-auto space-y-2">
          {% for message in messages %}
            <div class="p-3 text-sm text-teal-800 border border-teal-100 rounded-md bg-teal-50">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    {% block footer %}
      <footer class="border-t border-gray-100">
        <div class="max-w-5xl px-6 py-8 mx-auto text-sm text-center text-gray-400">
          Django Fullstack Starter — HTMX &amp; Alpine.js
        </div>
      </footer>
    {% endblock %}
  </body>
</html>
