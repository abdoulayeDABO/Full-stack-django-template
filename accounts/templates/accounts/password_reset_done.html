{% extends "accounts/auth_base.html" %}

{% block title %}Email envoyé{% endblock %}

{% block auth_content %}
  <div class="flex flex-col gap-6 text-center">
    <div class="flex flex-col gap-2">
      <h1 class="text-2xl font-bold">Email envoyé</h1>
      <p class="text-sm text-gray-500">
        Si un compte correspond à cet email, un lien de réinitialisation vient d'être envoyé.
        Pensez à vérifier vos spams.
      </p>
    </div>

    <a href="{% url 'login' %}"
       class="inline-flex items-center justify-center w-full h-9 px-4 text-sm font-medium text-white transition-colors bg-teal-600 rounded-md shadow-sm hover:bg-teal-700">
      Retour à la connexion
    </a>
  </div>
{% endblock %}
