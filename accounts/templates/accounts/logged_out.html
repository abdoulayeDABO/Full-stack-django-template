{% extends "accounts/auth_base.html" %}

{% block title %}Déconnexion{% endblock %}

{% block auth_content %}
  <div class="flex flex-col gap-6 text-center">
    <div class="flex flex-col gap-2">
      <h1 class="text-2xl font-bold">Vous êtes déconnecté</h1>
      <p class="text-sm text-gray-500">Merci d'avoir utilisé l'application.</p>
    </div>

    <div class="grid gap-3">
      <a href="{% url 'login' %}"
         class="inline-flex items-center justify-center w-full h-9 px-4 text-sm font-medium text-white transition-colors bg-teal-600 rounded-md shadow-sm hover:bg-teal-700">
        Connexion
      </a>
      <a href="{% url 'index' %}"
         class="inline-flex items-center justify-center w-full h-9 px-4 text-sm font-medium text-gray-700 transition-colors bg-white border border-gray-200 rounded-md shadow-sm hover:bg-gray-50">
        Accueil
      </a>
    </div>
  </div>
{% endblock %}
