<div class="grid gap-2">
  <label for="{{ field.id_for_label }}" class="text-sm font-medium leading-none text-gray-900">
    {{ field.label }}
  </label>
  {{ field }}
  {% if field.help_text %}
    <p class="text-xs text-gray-500">{{ field.help_text|safe }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="text-xs text-red-600">{{ error }}</p>
  {% endfor %}
</div>
